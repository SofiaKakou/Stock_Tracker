# Runs a study on GitHub's servers against the cloud database and posts the results to Discord.
# Actions tab -> "Research run" -> Run workflow -> pick a study.

name: Research run

on:
  workflow_dispatch:
    inputs:
      study:
        description: "Which study to run"
        type: choice
        default: factors
        options: [factors, ml, mllab, ideas, candidates, lookahead, audit, forecast, model, insiders, momentum, trend]
      args:
        description: "Extra options, e.g. --benchmark IWM --since 2016-01-01 (optional)"
        type: string
        default: ""
      refresh:
        description: "Refresh data first? price-check = does the backup price source (Stooq) answer and agree with our prices; email-test = make the report and email it now (checks the EMAIL_* secrets); sec-check = one small SEC request to see if the SEC still refuses us (lifts the pause if not); fundamentals = company financials now (~15 min); short = FINRA short selling data; fates = industry codes and what happened to every company that disappeared, from the SEC's bulk file (~15 min); reports = read up to 4,000 annual/quarterly reports for the text signals (~45 min; gentle on the SEC); full = whole nightly update"
        type: choice
        default: none
        options: [none, sec-check, price-check, email-test, fundamentals, short, fates, reports, full]

concurrency:
  group: nightly-market-run    # shares the database with the nightly run, so never at the same time
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: |
            market.db
            alert_state.json
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Refresh data
        if: inputs.refresh != 'none'
        run: |
          if [ "${{ inputs.refresh }}" = "fundamentals" ]; then
            python -m trend_bot db update --fundamentals-only --ignore-sec-pause || echo "::warning::refresh did not finish"
          elif [ "${{ inputs.refresh }}" = "fates" ]; then
            python -m trend_bot db update --fates-only --sec-lookups 20000 || echo "::warning::refresh did not finish"
          elif [ "${{ inputs.refresh }}" = "reports" ]; then
            python -m trend_bot db update --reports-only --report-downloads 4000 || echo "::warning::refresh did not finish"
          elif [ "${{ inputs.refresh }}" = "price-check" ]; then
            python -m trend_bot price-check || echo "::warning::the backup price source did not answer"
            python -m trend_bot price-check --ticker AAPL || true
          elif [ "${{ inputs.refresh }}" = "email-test" ]; then
            mkdir -p reports
            python -m trend_bot report || echo "::warning::the report could not be made"
            python -m trend_bot send-email || echo "::warning::the email could not be sent (see above)"
          elif [ "${{ inputs.refresh }}" = "sec-check" ]; then
            python -m trend_bot sec-check || echo "::warning::the SEC still refuses our requests"
          elif [ "${{ inputs.refresh }}" = "short" ]; then
            python -m trend_bot db update --short-only || echo "::warning::refresh did not finish"
          else
            python -m trend_bot db update || echo "::warning::refresh did not finish"
          fi

      - name: Run the study
        run: |
          mkdir -p reports
          python -m trend_bot study ${{ inputs.study }} ${{ inputs.args }} 2>&1 | tee reports/study-${{ inputs.study }}.txt
          {
            echo "## study ${{ inputs.study }} ${{ inputs.args }}"
            echo '```'
            cat reports/study-${{ inputs.study }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post results to Discord
        if: always()
        run: |
          python -m trend_bot send-report --path reports/study-${{ inputs.study }}.txt \
            --message "🔬 Research run: study ${{ inputs.study }} ${{ inputs.args }} (results attached)" || true

      # Always saved: studies also store decisions (ML verdict, mix choice, cap, probation board).
      - name: Save database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            market.db
            alert_state.json
          key: market-db-${{ github.run_id }}

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: study-${{ inputs.study }}-${{ github.run_id }}
          path: reports/study-${{ inputs.study }}.txt
          if-no-files-found: ignore
          retention-days: 90
