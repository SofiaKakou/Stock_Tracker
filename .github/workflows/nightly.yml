# Runs the bot every weekday evening on GitHub's servers, so no PC needs to be on.
#
# Setup (once): repository Settings -> Secrets and variables -> Actions -> New repository secret
#   DISCORD_WEBHOOK_URL   your Discord webhook URL
#   SEC_USER_AGENT        your name and email, e.g. "Jane Doe jane@example.com"
# Then run it once by hand: Actions tab -> "Nightly market run" -> Run workflow.
# The first run builds the database from scratch (1-2 hours); later runs take a few minutes.

name: Nightly market run

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, Mon-Fri: after the US market closes
  workflow_dispatch: {}        # "Run workflow" button for a manual run

concurrency:
  group: nightly-market-run    # never two runs at once
  cancel-in-progress: false

# Least privilege: the workflow's token can only read the code (jobs that need more say so).
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The database (and alert memory) carries over between runs via GitHub's cache.
      - name: Restore database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            market.db
            alert_state.json
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      # Steps that fail only log a warning and carry on; they also note it in reports/problems.txt
      # for the health check at the end.
      - name: Update data
        run: |
          mkdir -p reports
          if [ ! -f market.db ]; then
            echo "::warning::the saved database wasn't found; starting from an empty one (see the import-db workflow)"
            echo "the saved database wasn't found, so tonight started from an empty one (Actions -> Import database fixes it)" >> reports/problems.txt
          fi
          python -m trend_bot db update --flag-incomplete reports/prices_incomplete || { echo "::warning::db update did not finish (see log); continuing"; echo "the data update didn't finish" >> reports/problems.txt; }

      # If Yahoo refused or stopped partway (usually a short rate limit), wait an hour and try the
      # prices once more, so tonight's messages use today's prices instead of waiting for tomorrow.
      - name: Retry prices later
        if: hashFiles('reports/prices_incomplete') != ''
        run: |
          echo "::warning::$(cat reports/prices_incomplete); trying again in an hour"
          sleep 3600
          python -m trend_bot db update --prices-only --max-age-hours 0.5 || echo "the price retry didn't finish" >> reports/problems.txt

      # Monthly honesty checks: once a month (the first night of days 1-3 that hasn't done them, so a
      # failed night is retried but a good one isn't repeated), plus the two retired models quarterly.
      # Manual runs do everything. See trend_bot/commands/data.py: cmd_monthly_due.
      - name: Monthly honesty check
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
        run: |
          mkdir -p reports
          force=""; [ "${{ github.event_name }}" = "workflow_dispatch" ] && force="--force"
          steps="$(python -m trend_bot monthly-due $force)"
          if [ -n "$steps" ]; then
            ok=1
            while IFS= read -r step; do
              python -m trend_bot $step || { ok=0; echo "::warning::$step failed"; echo "'$step' failed" >> reports/problems.txt; }
            done <<< "$steps"
            [ "$ok" = 1 ] && python -m trend_bot monthly-due --mark
          fi

      - name: Discord alerts
        run: python -m trend_bot alert --summary --market --model --forecast

      # Safety check of the portfolio's stocks: bankruptcy, delisting notice or unreliable accounts =
      # emergency exit (the demo account sells at the next open); other red flags and big falls = warning.
      - name: Portfolio safety
        run: python -m trend_bot safety --discord || echo "the safety check failed" >> reports/problems.txt

      # Optional: the demo account (fake money on Alpaca's paper trading) follows the portfolio.
      # Does nothing until the ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY secrets exist (GUIDE.md).
      - name: Demo account
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m trend_bot paper --discord || echo "the demo account step failed" >> reports/problems.txt

      - name: Report
        run: |
          python -m trend_bot report
          python -m trend_bot send-report
          python -m trend_bot send-guide --once || true   # only when GUIDE.md changed

      - name: Bot health
        if: always()
        run: |
          python -m trend_bot health --discord --problems reports/problems.txt --job-status "${{ job.status }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

      # Optional: the report by email too. Does nothing until the EMAIL_USER and
      # EMAIL_APP_PASSWORD secrets exist (see trend_bot/email_report.py for the 2-minute setup).
      - name: Email the report
        if: always()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m trend_bot send-email --problems reports/problems.txt || true

      - name: Save database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            market.db
            alert_state.json
          key: market-db-${{ github.run_id }}

      # A weekly copy outside the cache: if GitHub's cache ever loses the database, Actions ->
      # "Import database" with this run's number puts it back (kept 8 days, so one always exists).
      - name: Weekly database backup
        id: weekday
        if: always()
        run: echo "day=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Upload the weekly backup
        if: always() && steps.weekday.outputs.day == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: market-db-export
          path: |
            market.db
            alert_state.json
          retention-days: 8

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: report-${{ github.run_id }}
          path: reports/latest.html
          if-no-files-found: ignore
          retention-days: 30

  # Optional: publish the report as a web page you can open on your phone. Off unless you turn it on,
  # because the page is public (anyone with the link can see it, like this public repository):
  #   Settings -> Pages -> Source: "GitHub Actions", then
  #   Settings -> Secrets and variables -> Actions -> Variables -> New variable PUBLISH_DASHBOARD = true
  # The page is then at https://<your-user>.github.io/<repository>/ and updates after every nightly run.
  publish:
    needs: run
    if: always() && vars.PUBLISH_DASHBOARD == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: report-${{ github.run_id }}
          path: site

      - name: Make it the home page
        run: mv site/latest.html site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5