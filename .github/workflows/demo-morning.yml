# Demo account, morning check: after the market opens, reports how last night's practice orders
# filled (price paid vs the close the tests use) and sends again anything the broker refused overnight.
# Does nothing until the ALPACA_* secrets exist; most mornings there's nothing to report and it posts nothing.

name: Demo account morning check

on:
  schedule:
    - cron: "52 14 * * 1-5"   # 14:52 UTC, Mon-Fri: after the US open in both summer and winter time
  workflow_dispatch: {}

concurrency:
  group: nightly-market-run    # shares the database with the nightly run
  cancel-in-progress: false

# Least privilege: the workflow's token can only read the code (jobs that need more say so).
permissions:
  contents: read

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore database
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |            # must list the same files as the nightly run's save, or the cache isn't found
            market.db
            alert_state.json
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Check the demo account
        if: steps.restore.outputs.cache-matched-key != ''
        run: python -m trend_bot paper --morning --discord --changed-flag changed.flag

      - name: Check the $100 account
        if: always() && steps.restore.outputs.cache-matched-key != ''
        env:
          ALPACA_SMALL_KEY_ID: ${{ secrets.ALPACA_SMALL_KEY_ID }}
          ALPACA_SMALL_SECRET_KEY: ${{ secrets.ALPACA_SMALL_SECRET_KEY }}
        run: python -m trend_bot paper --account small --morning --discord --changed-flag changed.flag

      # Saved only when something changed, so most mornings add nothing to GitHub's cache.
      - name: Save database
        if: hashFiles('changed.flag') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            market.db
            alert_state.json
          key: market-db-${{ github.run_id }}

      - name: Tell me if this failed
        if: failure()
        run: |
          python -m trend_bot notify --title "⚠️ Demo account morning check failed" \
            --text "The demo account morning check job stopped with an error (fake money). Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
