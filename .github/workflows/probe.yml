name: Probe data sources (temporary)
on:
  push:
    branches: [claude/stock-trend-bot-r1ou90]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FINRA
        run: |
          for y in 2006 2008 2010 2012 2013 2015 2016 2017 2018; do
            for d in ${y}0115 ${y}0114 ${y}0113 ${y}0112 ${y}0131 ${y}0130 ${y}0129 ${y}0613 ${y}0615 ${y}0614 ${y}0612 ${y}0630 ${y}0629 ${y}0628; do
              c=$(curl -s -o out -w "%{http_code}" "https://cdn.finra.org/equity/otcmarket/biweekly/shrt${d}.csv")
              if [ "$c" = 200 ]; then echo "$d OK $(wc -l < out) lines"; head -2 out; grep -c '|NYSE|\||NNM|\||NSD|' out || true; grep -E '^[^|]*\|(AAPL|IBM|BRK)' out | head -3; fi
            done
          done
          curl -s -o out "https://cdn.finra.org/equity/otcmarket/biweekly/shrt20260915.csv"; cut -d'|' -f5 out | sort | uniq -c
          grep -E '"BRK|"BF' out | head -4
          grep -c . out
