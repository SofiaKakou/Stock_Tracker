# Day-trading demo account (fake money, its own Alpaca paper account; see trend_bot/daytrade.py).
# Two parts a day, because a GitHub job may run at most 6 hours. The timer at cron-job.org starts each
# part (GitHub's own schedules start late or not at all); the schedules below are only backups, for New
# York summer and winter time: the first start inside a part's window runs it, the others exit at once.
# Does nothing until the ALPACA_DAY_KEY_ID and ALPACA_DAY_SECRET_KEY secrets exist.

name: Day trading (demo)

on:
  schedule:
    - cron: "17 13 * * 1-5"   # morning part: 9:17 New York summer time ...
    - cron: "17 14 * * 1-5"   # ... or winter time
    - cron: "17 16 * * 1-5"   # afternoon part: 12:17 New York summer time ...
    - cron: "17 17 * * 1-5"   # ... or winter time
  workflow_dispatch:
    inputs:
      phase:
        description: "Which part (auto = whichever it is now; report = only the evening report)"
        type: choice
        default: auto
        options: [auto, morning, afternoon, report]
      date:
        description: "With report: redo that day's report (YYYY-MM-DD); empty = today"
        type: string
        default: ""

concurrency:
  group: day-trading
  cancel-in-progress: false

# Least privilege: the workflow's token can only read the code (jobs that need more say so).
permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write      # only to start the afternoon part when the morning part ends (below)
    env:
      ALPACA_DAY_KEY_ID: ${{ secrets.ALPACA_DAY_KEY_ID }}
      ALPACA_DAY_SECRET_KEY: ${{ secrets.ALPACA_DAY_SECRET_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Which stocks to watch and the 10-year test results, from the last `study intraday` (read only).
      - name: Restore intraday study
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: intraday.db
          key: intraday-db-${{ github.run_id }}
          restore-keys: intraday-db-

      - name: Restore running totals
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: daytrade.json
          key: daytrade-state-${{ github.run_id }}
          restore-keys: daytrade-state-

      - name: Trade
        env:
          REDO_DATE: ${{ inputs.date }}
        run: python -m trend_bot daytrade --phase "${{ inputs.phase || 'auto' }}" ${REDO_DATE:+--date "$REDO_DATE"} --discord

      # Every trade so far (expected vs actual price, result): download it from the run's page.
      - name: Keep the trade log
        if: always() && hashFiles('daytrade_log.csv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: day-trade-log
          path: daytrade_log.csv
          retention-days: 90

      - name: Save running totals
        if: always() && hashFiles('daytrade.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: daytrade.json
          key: daytrade-state-${{ github.run_id }}

      # GitHub sometimes starts scheduled runs late or not at all. So when the morning part ends (just
      # after 12:00 New York), it starts the afternoon part itself; that run begins as soon as this one
      # ends. (The afternoon schedules stay as backups; whichever comes first runs, the others exit.)
      - name: Start the afternoon part
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$(python -c "
          import datetime as d, json, os, zoneinfo
          now = d.datetime.now(zoneinfo.ZoneInfo('America/New_York'))
          s = json.load(open('daytrade.json')) if os.path.exists('daytrade.json') else {}
          ran = s.get('ran', {}).get(now.date().isoformat(), [])
          print('yes' if 'morning' in ran and 'afternoon' not in ran and d.time(11, 40) <= now.time() < d.time(15, 40) else 'no')")
          if [ "$next" = "yes" ]; then
            gh workflow run daytrade.yml --ref "$GITHUB_REF_NAME" -f phase=auto && echo "afternoon part started"
          fi

      - name: Tell me if this failed
        if: failure()
        run: |
          python -m trend_bot notify --title "⚠️ Day trading failed" \
            --text "The day trading job stopped with an error (fake money). The safety net closes any day-trading positions left open. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
