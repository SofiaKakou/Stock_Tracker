# "Why isn't this stock ranked?" Actions tab -> "Why is a stock (not) ranked?" -> Run workflow ->
# type one or more tickers. The answer is posted to Discord (and shown in the run's log).
# Read-only: it uses the latest database and changes nothing.

name: Why is a stock (not) ranked?

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers, separated by spaces (e.g. AAPL BRK-B)"
        type: string
        required: true

# Least privilege: the workflow's token can only read the code (jobs that need more say so).
permissions:
  contents: read

jobs:
  why:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |            # must list the same files as the nightly run's save, or the cache isn't found
            market.db
            alert_state.json
          key: market-db-${{ github.run_id }}
          restore-keys: market-db-

      - name: Explain
        env:
          TICKERS: ${{ inputs.tickers }}
        run: python -m trend_bot why $TICKERS --discord
